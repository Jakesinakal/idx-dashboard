finance_data:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'etl-financial-project') }}"
      dataset: "{{ env_var('BQ_DATASET', 'financial_data') }}"
      # GOOGLE_APPLICATION_CREDENTIALS is set in .env as a path relative to the project root.
      # Run all dbt commands from the project root so this path resolves correctly.
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', 'credentials/gcp-credentials.json') }}"
      threads: 4
      timeout_seconds: 300
      location: US
